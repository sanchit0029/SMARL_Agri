version: '3.8'

services:
  agriprice-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriprice_ai_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist SQLite database across container updates
      - agri_data:/app/backend/db

volumes:
  agri_data:
    driver: local
